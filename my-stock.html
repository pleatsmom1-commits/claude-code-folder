<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>밤낮딜리버리 내 재고표</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
    :root {
        --bg: #f1f5f9; --card: #ffffff; --line: #e2e8f0; --text: #0f172a; --sub: #64748b;
        --accent: #0d9488; --accent-bg: #ccfbf1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.5; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 14px; }
    .brand b { font-size: 16px; }
    .brand a { flex-shrink: 0; white-space: nowrap; display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; box-shadow: 0 1px 3px rgba(15,23,42,.18); }
    .brand a:hover { background: #4338ca; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .hero { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .hero .company { font-size: 20px; font-weight: 800; }
    .hero .desc { color: var(--sub); font-size: 13px; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat { background: var(--accent-bg); color: var(--accent); border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 96px; }
    .stat.gray { background: #f1f5f9; color: var(--sub); }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; font-weight: 700; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tabs { display: flex; background: #e2e8f0; border-radius: 10px; padding: 3px; }
    .tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--sub); cursor: pointer; }
    .tabs button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    input[type=search] { flex: 1; min-width: 160px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
    .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:disabled { opacity: .4; cursor: default; }
    .count { font-size: 13px; color: var(--sub); margin: 10px 2px 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 12px; color: var(--sub); font-weight: 700; padding: 8px 6px; border-bottom: 2px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: #fff; z-index: 1; }
    td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .table-box { overflow: auto; max-height: 70vh; }
    .sub { color: var(--sub); font-size: 12px; }
    .state { text-align: center; padding: 60px 16px; color: var(--sub); }
    .note { font-size: 12px; color: var(--sub); margin: 10px 2px 0; }
    .tip { background: #f0fdfa; border: 1px solid #99f6e4; color: #115e59; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
    .tip a { color: #0f766e; font-weight: 800; }
    .notice { background: #fffbeb; border: 2px solid #fcd34d; color: #78350f; }
    .notice b { font-size: 15px; }
    .notice p { margin: 6px 0 0; font-size: 13px; }
    .notice p.sm { font-size: 12px; color: #92400e; }
    .foot { text-align: center; font-size: 12px; color: var(--sub); margin-top: 18px; }
    .qty { display: inline-flex; align-items: center; gap: 4px; }
    .qty button { width: 30px; height: 30px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; }
    .qty input { width: 64px; height: 30px; text-align: center; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-weight: 800; }
    .qty input.zero { color: var(--sub); }
    .saved { color: var(--accent); font-size: 11px; font-weight: 700; margin-left: 4px; }
    .plus { color: #059669; font-weight: 800; } .minus { color: #e11d48; font-weight: 800; }
    @media (max-width: 640px) {
        thead { display: none; }
        table, tbody, tr, td { display: block; width: 100%; }
        tr { border-bottom: 1px solid var(--line); padding: 10px 2px; }
        td { border: 0; padding: 2px 0; }
        td:empty { display: none; }
        td[data-label]::before { content: attr(data-label) " "; color: var(--sub); font-size: 12px; }
        td.in { display: inline-block; width: auto; margin-right: 10px; }
        td.in::before { content: none !important; }
        .table-box { max-height: none; }
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand"><b>밤낮딜리버리 내 재고표</b><a href="/">← 택배접수 화면으로</a></div>
    <div id="app"><div class="state">불러오는 중입니다...</div></div>
    <div class="foot">문의: 밤낮딜리버리 카카오톡 채널</div>
</div>
<script src="config.js"></script>
<script src="view-as.js"></script>
<script>
    // 셀러가 자기 사무실에 가진 재고를 직접 적는 표 (풀필먼트·재고보관을 안 쓰는 택배 업체용, 2026-11-19)
    //  상품 = 상품관리(products)의 내 상품. 수량 = seller_own_stock (supabase/own_stock.sql)
    //  밤낮딜리버리 사무실 재고(inventory)와는 따로입니다.
    let client, company = '', products = [], stock = new Map(), moves = [], filter = 'all', viewOnly = false, tableMissing = false;
    const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const norm = v => String(v ?? '').replace(/\s+/g, '').toLowerCase();
    const showState = html => { document.getElementById('app').innerHTML = `<div class="card state">${html}</div>`; };
    const mallText = p => (p.mall_names || []).map(n => n.name).filter(Boolean).join(', ');
    const fmtTime = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

    async function fetchAll(make) {
        const out = [];
        for (let from = 0; ; from += 1000) {
            const { data, error } = await make().range(from, from + 999);
            if (error) return { data: out, error };
            out.push(...(data || []));
            if (!data || data.length < 1000) return { data: out, error: null };
        }
    }

    async function init() {
        if (!window.supabase) { showState('화면을 불러오지 못했습니다. 새로고침해주세요.'); return; }
        client = VIEW_AS.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data: { session } } = await client.auth.getSession();
        if (!session) { showState('로그인 후 내 재고표를 볼 수 있습니다.<br><br><a class="btn primary" href="/">로그인하러 가기</a>'); return; }
        const { data: profile, error } = await client.from('profiles').select('company,role,status').eq('id', session.user.id).single();
        if (error || !profile) { showState('계정 정보를 불러오지 못했습니다.<br>다시 로그인해주세요.<br><br><a class="btn" href="/">주문접수 화면</a>'); return; }
        if (profile.role === 'admin') {
            if (!VIEW_AS.company) { showState('관리자는 [셀러 관리] > [화면 보기]에서 업체 화면으로 열어주세요.<br><br><a class="btn" href="/">주문접수 화면</a>'); return; }
            company = VIEW_AS.company; viewOnly = true;
            VIEW_AS.start('내 재고표');
        } else {
            if (profile.status !== 'approved') { showState('관리자 승인 후 내 재고표를 쓸 수 있습니다.'); return; }
            company = profile.company;
        }
        document.title = `${company} 내 재고표`;
        await load();
    }

    async function load() {
        let pq = () => client.from('products').select('id,code,company,wholesale_company,wholesale_product,color,size,mall_names').is('deleted_at', null).order('wholesale_company').order('wholesale_product').order('id');
        const [p, s] = await Promise.all([fetchAll(pq), fetchAll(() => client.from('seller_own_stock').select('product_id,qty,updated_at').order('product_id'))]);
        if (p.error) { showState('상품을 불러오지 못했습니다. 새로고침해주세요.'); return; }
        products = p.data.filter(x => norm(x.company) === norm(company));
        tableMissing = !!s.error;
        stock = new Map((s.data || []).map(r => [r.product_id, r]));
        render();
        if (!tableMissing) loadMoves();
    }

    async function loadMoves() {
        const { data } = await client.from('seller_own_stock_moves').select('product_id,change,qty_after,reason,created_at').order('created_at', { ascending: false }).limit(100);
        moves = data || [];
        const box = document.getElementById('moves');
        if (box) box.innerHTML = movesHtml();
    }

    const qtyOf = id => (stock.get(id) || {}).qty || 0;

    function render() {
        const total = products.reduce((n, p) => n + qtyOf(p.id), 0);
        const have = products.filter(p => qtyOf(p.id) > 0).length;
        document.getElementById('app').innerHTML = `
        <div class="card hero">
            <div><div class="company">${esc(company)}</div><div class="desc">내 매장·사무실에 있는 재고를 직접 적어 두는 표예요.</div></div>
            <div class="stats">
                <div class="stat gray"><b>${products.length.toLocaleString('ko-KR')}</b><span>등록 상품</span></div>
                <div class="stat"><b>${have.toLocaleString('ko-KR')}</b><span>재고 있는 상품</span></div>
                <div class="stat"><b>${total.toLocaleString('ko-KR')}</b><span>총 재고 (개)</span></div>
            </div>
        </div>
        <div class="card notice">
            <b>📢 대표님 매장·사무실에서 직접 관리하는 상품관리 및 재고표입니다</b>
            <p>밤낮딜리버리 사무실에서 관리되지 않는 재고예요. 주로 <b>풀필먼트를 이용하지 않고, 픽업/택배수령을 이용하시는 대표님들</b>을 위한 기능이에요.</p>
            <p>🔒 <b>밤낮딜리버리 관리자는 이 재고표를 수정할 수 없어요.</b> 상품 입고·출고·수량 맞추기 등 모든 관리를 대표님이 직접 해 주셔야 해요.</p>
            <p class="sm">풀필먼트로 밤낮딜리버리 사무실에 맡긴 재고는 주문접수 화면의 [재고 확인]에서 보세요.</p>
        </div>
        ${tableMissing ? '<div class="card tip" style="background:#fff7ed;border-color:#fed7aa;color:#9a3412">아직 준비 중이에요. (관리자: supabase/own_stock.sql 실행 필요)</div>' : ''}
        <div class="card">
            <p class="tip">📦 새 상품은 <a href="/products">[상품관리]</a>에서 등록하면 여기에 저절로 나와요. 쇼핑몰 주문서로 <b>사입 목록 만들기</b>를 하면 내 재고만큼 빼고 사입할 수량을 알려 드려요.</p>
            <div class="tools" style="margin-top:12px">
                <div class="tabs">
                    <button class="${filter === 'all' ? 'on' : ''}" onclick="setFilter('all')">전체</button>
                    <button class="${filter === 'have' ? 'on' : ''}" onclick="setFilter('have')">재고 있음</button>
                    <button class="${filter === 'zero' ? 'on' : ''}" onclick="setFilter('zero')">재고 0</button>
                </div>
                <input type="search" id="q" placeholder="도매처·상품명·컬러·사이즈·쇼핑몰상품명 검색" oninput="drawRows()">
                <button class="btn" onclick="downloadExcel()" ${products.length ? '' : 'disabled'}>엑셀 받기</button>
                <button class="btn primary" onclick="document.getElementById('xl').click()" ${products.length && !viewOnly && !tableMissing ? '' : 'disabled'}>엑셀로 한 번에 고치기</button>
                <input type="file" id="xl" accept=".xlsx,.xls" hidden onchange="uploadExcel(event)">
            </div>
            <div class="count" id="count"></div>
            <div class="table-box">
                <table>
                    <thead><tr><th>상품코드</th><th>도매처</th><th>도매상품명</th><th>컬러</th><th>사이즈</th><th>쇼핑몰상품명</th><th>내 재고</th><th>바뀐 때</th></tr></thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <p class="note">[-] [+] 를 누르거나 숫자를 바로 고치면 저절로 저장돼요. 엑셀은 [엑셀 받기]로 받은 파일의 '내 재고' 칸만 고쳐서 올리면 돼요.</p>
        </div>
        <div class="card"><h3 style="margin:0 0 8px;font-size:15px">최근 바뀐 기록</h3><div id="moves">${movesHtml()}</div></div>`;
        drawRows();
    }

    function setFilter(f) { filter = f; render(); }

    function drawRows() {
        const q = norm(document.getElementById('q')?.value);
        const list = products.filter(p => (filter === 'all' || (filter === 'have' ? qtyOf(p.id) > 0 : qtyOf(p.id) === 0))
            && (!q || norm([p.code, p.wholesale_company, p.wholesale_product, p.color, p.size, mallText(p)].join(' ')).includes(q)));
        document.getElementById('count').textContent = `${list.length.toLocaleString('ko-KR')}개 상품`;
        const off = viewOnly || tableMissing ? 'disabled' : '';
        document.getElementById('rows').innerHTML = list.map(p => {
            const q = qtyOf(p.id), s = stock.get(p.id);
            return `<tr>
                <td class="sub in">${esc(p.code)}</td>
                <td class="in"><b>${esc(p.wholesale_company)}</b></td>
                <td class="in">${esc(p.wholesale_product)}</td>
                <td class="in">${esc(p.color)}</td>
                <td class="in">${esc(p.size)}</td>
                <td class="sub" data-label="쇼핑몰">${esc(mallText(p))}</td>
                <td data-label="내 재고"><span class="qty">
                    <button ${off} onclick="bump(${p.id}, -1)">−</button>
                    <input ${off} id="q-${p.id}" type="number" min="0" inputmode="numeric" value="${q}" class="${q ? '' : 'zero'}" onchange="setQty(${p.id}, this.value)">
                    <button ${off} onclick="bump(${p.id}, 1)">+</button>
                </span><span class="saved" id="ok-${p.id}"></span></td>
                <td class="sub">${s ? fmtTime(s.updated_at) : '-'}</td>
            </tr>`;
        }).join('') || `<tr><td colspan="8" class="state" style="padding:30px">${products.length ? '찾는 상품이 없어요.' : '아직 등록한 상품이 없어요. <a href="/products">[상품관리]</a>에서 먼저 등록해 주세요.'}</td></tr>`;
    }

    async function apply(items, mode, reason) {
        const { data, error } = await client.rpc('own_stock_apply', { p_items: items, p_mode: mode, p_reason: reason });
        if (error) { alert('저장하지 못했어요.\n' + (error.message || '')); return false; }
        return data;
    }

    async function saveOne(id, qty, reason) {
        qty = Math.max(0, parseInt(qty, 10) || 0);
        if (qty === qtyOf(id)) { drawRows(); return; }
        const ok = await apply([{ product_id: id, qty }], 'set', reason);
        if (ok === false) { drawRows(); return; }
        stock.set(id, { product_id: id, qty, updated_at: new Date().toISOString() });
        render();
        const m = document.getElementById('ok-' + id); if (m) m.textContent = '저장됨';
        loadMoves();
    }
    const bump = (id, d) => saveOne(id, qtyOf(id) + d, d > 0 ? '+1' : '-1');
    const setQty = (id, v) => saveOne(id, v, '직접 수정');

    function excelRows() {
        return products.map(p => [p.code, p.wholesale_company, p.wholesale_product, p.color, p.size, mallText(p), qtyOf(p.id)]);
    }
    function downloadExcel() {
        const ws = XLSX.utils.aoa_to_sheet([['상품코드', '도매처', '도매상품명', '컬러', '사이즈', '쇼핑몰상품명', '내 재고']].concat(excelRows()));
        ws['!cols'] = [{ wch: 10 }, { wch: 16 }, { wch: 24 }, { wch: 10 }, { wch: 8 }, { wch: 28 }, { wch: 8 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '내 재고');
        const d = new Date();
        XLSX.writeFile(wb, `내재고표_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.xlsx`);
    }

    // [엑셀 받기] 파일의 '상품코드' + '내 재고' 칸만 읽어 한 번에 맞춤
    async function uploadExcel(e) {
        const file = e.target.files[0]; e.target.value = '';
        if (!file) return;
        let rows;
        try {
            const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
            rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
        } catch { alert('엑셀 파일을 읽지 못했어요.'); return; }
        const head = (rows[0] || []).map(norm);
        const ci = head.indexOf('상품코드'), qi = head.findIndex(h => h === '내재고' || h === '재고' || h === '수량');
        if (ci < 0 || qi < 0) { alert("'상품코드'와 '내 재고' 칸이 있는 파일이어야 해요. [엑셀 받기]로 받은 파일을 고쳐서 올려 주세요."); return; }
        const byCode = new Map(products.map(p => [String(p.code).toUpperCase(), p]));
        const items = [], unknown = [];
        rows.slice(1).forEach(r => {
            const code = String(r[ci] || '').trim().toUpperCase();
            if (!code) return;
            const p = byCode.get(code);
            if (!p) { unknown.push(code); return; }
            const q = Math.max(0, parseInt(String(r[qi]).replace(/[^\d-]/g, ''), 10) || 0);
            if (q !== qtyOf(p.id)) items.push({ product_id: p.id, qty: q });
        });
        if (!items.length) { alert('바뀐 재고가 없어요.' + (unknown.length ? `\n(모르는 상품코드 ${unknown.length}개는 건너뜀)` : '')); return; }
        if (!confirm(`재고 ${items.length}개 상품을 엑셀대로 바꿀까요?` + (unknown.length ? `\n(모르는 상품코드 ${unknown.length}개는 건너뜀)` : ''))) return;
        const n = await apply(items, 'set', '엑셀로 수정');
        if (n === false) return;
        alert(`${n}개 상품의 재고를 바꿨어요.`);
        await load();
    }

    function movesHtml() {
        if (tableMissing) return '<p class="sub">-</p>';
        if (!moves.length) return '<p class="sub">아직 바뀐 기록이 없어요.</p>';
        const byId = new Map(products.map(p => [p.id, p]));
        const mine = moves.filter(m => byId.has(m.product_id));   // 관리자 화면 보기: 이 업체 것만
        if (!mine.length) return '<p class="sub">아직 바뀐 기록이 없어요.</p>';
        return `<div class="table-box" style="max-height:320px"><table><thead><tr><th>때</th><th>상품</th><th>바뀐 수</th><th>남은 재고</th><th>이유</th></tr></thead><tbody>${mine.map(m => {
            const p = byId.get(m.product_id) || {};
            return `<tr><td class="sub">${fmtTime(m.created_at)}</td><td>${esc([p.wholesale_company, p.wholesale_product, p.color, p.size].filter(Boolean).join(' / ') || '(지운 상품)')}</td>
                <td class="${m.change > 0 ? 'plus' : 'minus'}">${m.change > 0 ? '+' : ''}${m.change}</td><td><b>${m.qty_after}</b></td><td class="sub">${esc(m.reason)}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    }

    init();
</script>
</body>
</html>
