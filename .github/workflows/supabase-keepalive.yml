# Supabase 자동 깨우기 (예비용): 3일마다 Supabase 에 한 번 접속합니다.
# 실패하면 GitHub 가 저장소 주인에게 메일로 알려줍니다 (Supabase 가 일시정지됐다는 신호).
name: Supabase keepalive

on:
  schedule:
    - cron: "17 2 */3 * *"   # 3일마다 UTC 02:17 (한국시간 11:17)
  workflow_dispatch: {}        # Actions 화면에서 직접 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://doierphwtctcomrujgem.supabase.co
          SUPABASE_KEY: sb_publishable_5XM4HoFx4U_0kL-8ET_x-Q_WfvGwFXL
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/couriers?select=id&limit=1")
          echo "Supabase HTTP $code"
          test "$code" = "200"
