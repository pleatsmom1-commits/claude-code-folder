<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적 문의 - 밤낮딜리버리</title>
<!-- 견적 문의 화면 (/quote). 홈페이지 [견적요청접수] 버튼이 여기로 옵니다.
     내용은 /api/inquiry (worker/inquiry.js) 로 보내 '[견적문의]'로 저장되고, 대표님이 관리자 화면 > AI 상담에서 답하면
     손님 휴대폰으로 문자가 갑니다. (따로 실행할 SQL 없음: inquiries.sql 의 문의 표를 함께 씁니다) -->
<style>
*{box-sizing:border-box}
:root{--p:#6c5ce7;--t:#0f172a;--m:#64748b;--r:#e11d48}
body{margin:0;background:#f1f5f9;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--t)}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#fff}
header{background:var(--p);color:#fff;padding:18px}
header b{font-size:20px;display:block}
header small{font-size:13.5px;opacity:.92;line-height:1.5;display:block;margin-top:3px}
main{padding:20px 18px 40px}
.f{margin-bottom:14px}
.f label,.lb{display:block;font-size:15px;font-weight:800;margin-bottom:6px}
.f label span,.lb span{font-weight:500;color:var(--m);font-size:13px}
input,textarea{width:100%;border:2px solid #cbd5e1;border-radius:12px;padding:12px;font-size:16px;font-family:inherit;color:var(--t)}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
.bad{border-color:var(--r)!important;background:#fff1f2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #e2e8f0;background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--t)}
.chip.on{border-color:var(--p);background:#f5f3ff;color:#5b21b6}
.agree{display:flex;gap:10px;align-items:flex-start;border:2px solid #e2e8f0;border-radius:14px;padding:13px;font-size:15px;line-height:1.5;margin:16px 0;cursor:pointer}
.agree input{width:22px;height:22px;flex:none;margin-top:2px}
.agree small{display:block;color:var(--m);font-size:13px}
button.send{width:100%;border:0;background:var(--p);color:#fff;border-radius:14px;padding:16px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer}
button.send:disabled{opacity:.6}
.err{color:var(--r);font-weight:800;font-size:15px;margin-top:10px}
.done{text-align:center;padding:50px 10px}
.done .big{font-size:60px}
.done p{font-size:16px;color:#475569;line-height:1.65}
.hide{display:none}
/* PC(넓은 화면)에서는 칸을 두 줄로 나란히 놓고 글씨·여백을 조금 줄여 한 화면에 다 보이게 (휴대폰은 그대로) */
@media(min-width:768px){
  body{padding:28px 0}
  .wrap{max-width:760px;min-height:0;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.08)}
  header{padding:16px 24px}
  header b{font-size:18px}
  header small{font-size:13px}
  main{padding:18px 24px 24px}
  #form{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
  #form .full,#form .agree,#form .send,#form .err{grid-column:1/-1}
  .f{margin-bottom:12px}
  .f label,.lb{font-size:14px;margin-bottom:5px}
  input,textarea{padding:9px 12px;font-size:15px;border-radius:10px}
  textarea{height:96px}
  .chip{padding:7px 13px;font-size:14px}
  .agree{padding:10px 12px;font-size:14px;margin:8px 0 12px}
  button.send{padding:13px;font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header><b>💰 견적 문의</b><small>물량과 원하시는 서비스를 남겨주시면<br>밤낮딜리버리 대표가 직접 확인하고 문자로 답변드려요.</small></header>
  <main>
    <form id="form" novalidate>
      <div class="f"><label>상호 (쇼핑몰명) *</label><input id="company" placeholder="예) 해피옷장"></div>
      <div class="f"><label>담당자 이름 <span>(선택)</span></label><input id="name" placeholder="예) 김대표"></div>
      <div class="f"><label>휴대폰 번호 * <span>답변을 문자로 보내드려요</span></label><input id="phone" inputmode="tel" placeholder="예) 010-1234-5678"></div>
      <div class="f full"><div class="lb">이용하실 서비스 * <span>여러 개 골라도 돼요</span></div>
        <div class="chips" id="services">
          <button type="button" class="chip">사입대행</button><button type="button" class="chip">풀필먼트 (고객 배송)</button>
          <button type="button" class="chip">매장·사무실 택배</button><button type="button" class="chip">당일배송</button>
          <button type="button" class="chip">도매물류전담</button><button type="button" class="chip">한집만 사입</button><button type="button" class="chip">기타</button>
        </div></div>
      <div class="f"><label>한 달 예상 물량 <span>(선택)</span></label><input id="volume" placeholder="예) 하루 30건, 한 달 약 600건"></div>
      <div class="f"><label>주로 사입하는 상가 <span>(선택)</span></label><input id="mall" placeholder="예) 누죤, 디오트, APM"></div>
      <div class="f full"><label>문의 내용 *</label><textarea id="question" rows="5" placeholder="궁금하신 점이나 원하시는 조건을 편하게 적어주세요"></textarea></div>
      <label class="agree" id="agree-box"><input type="checkbox" id="consent">
        <span><b>개인정보 수집·이용에 동의합니다 (필수)</b><small>견적 답변을 위해 상호·이름·휴대폰 번호를 받습니다. 문의 후 1년이 지나면 지웁니다.</small></span></label>
      <button class="send" id="send" type="submit">견적 문의 보내기</button>
      <div class="err" id="err"></div>
    </form>
    <div class="done hide" id="done"><div class="big">✅</div><h2>문의가 접수됐어요!</h2>
      <p>밤낮딜리버리 대표가 직접 확인하고<br>남겨주신 번호로 문자로 답변드릴게요.</p>
      <p style="font-size:14px">급하신 내용은 카톡 bamnatdelivery 또는 010-5425-9060으로 연락주세요.</p></div>
  </main>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('#services .chip').forEach(b => b.onclick = () => { b.classList.toggle('on'); $('services').classList.remove('bad'); });
  document.querySelectorAll('input,textarea').forEach(el => el.addEventListener('input', () => el.classList.remove('bad')));
  $('form').onsubmit = async e => {
    e.preventDefault();
    $('err').textContent = '';
    const v = id => $(id).value.trim();
    const services = [...document.querySelectorAll('#services .chip.on')].map(b => b.textContent);
    const bad = [];
    if (!v('company')) bad.push('company');
    if (!/^01\d{8,9}$/.test(v('phone').replace(/\D/g, ''))) bad.push('phone');
    if (!services.length) bad.push('services');
    if (!v('question')) bad.push('question');
    if (!$('consent').checked) bad.push('agree-box');
    bad.forEach(id => $(id).classList.add('bad'));
    if (bad.length) {
      $('err').textContent = '* 표시한 칸을 모두 적고, 개인정보 동의에 체크해 주세요.';
      $(bad[0]).scrollIntoView({ block: 'center' });
      return;
    }
    const head = ['[견적문의]', `서비스: ${services.join(', ')}`, v('volume') && `물량: ${v('volume')}`, v('mall') && `주 사입 상가: ${v('mall')}`].filter(Boolean);
    const question = [...head, '', v('question')].join('\n').slice(0, 1000);
    $('send').disabled = true; $('send').textContent = '보내는 중…';
    try {
      const res = await fetch(new URL('/api/inquiry', location.href).href, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company: v('company'), name: v('name'), phone: v('phone'), question, chatLog: [], consent: true, source: (document.referrer || location.href) + ' (견적문의)' }),
      });
      const r = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(r.error || `서버 오류 (HTTP ${res.status})`);
      $('form').classList.add('hide'); $('done').classList.remove('hide'); window.scrollTo(0, 0);
    } catch (err) {
      $('err').textContent = '보내지 못했어요: ' + err.message;
      $('send').disabled = false; $('send').textContent = '견적 문의 보내기';
    }
  };
})();
</script>
</body>
</html>
