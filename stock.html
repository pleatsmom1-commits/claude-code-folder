<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>밤낮딜리버리 재고표</title>
<!-- 예전 [재고 확인] 화면(stock_items)은 2026-11-22 없앴습니다. 재고는 새 재고표(/inventory) 하나로 봅니다.
     예전 주소(/stock?...)로 들어와도 같은 조건 그대로 재고표로 보냅니다. -->
<script>location.replace('/inventory' + location.search + location.hash);</script>
</head>
<body style="font-family:sans-serif;padding:40px;text-align:center">
재고표로 이동합니다… <a href="/inventory">바로 가기</a>
</body>
</html>
